name: CommentPlayer
options:
  bundleIdPrefix: com.samoilovprod
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FrameTimecode:
    path: Packages/FrameTimecode

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CommentPlayer:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: FrameTimecode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samoilovprod.commentplayer
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AHUWBSC593
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Comment Player
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

schemes:
  CommentPlayer:
    build:
      targets:
        CommentPlayer: all
    test:
      targets:
        - package: FrameTimecode/FrameTimecodeTests
